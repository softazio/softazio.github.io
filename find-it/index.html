<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const svg=$('scene'), wrap=$('sceneWrap');let zoom=1,cx=350,cy=300,drag=null,moved=false;
function portrait(){return window.innerWidth<=700}
function viewport(){const mobile=portrait();const rect=svg.getBoundingClientRect();const aspect=wrap.classList.contains('expanded')?Math.max(.35,rect.width/Math.max(rect.height,1)):(mobile?.75:1.5);const baseH=600/zoom;let w=baseH*aspect,H=baseH;if(w>900){w=900;H=w/aspect}return {w,H}}

function tone(freq,dur=.16,type='triangle',vol=.055){if(!context)return;let o=context.createOscillator(),g=context.createGain(),t=context.currentTime;o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(context.destination);o.start(t);o.stop(t+dur+.01)}
