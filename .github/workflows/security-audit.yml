name: SOFTAZIO Read-only Security Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.html'
      - '**.js'
      - '**.json'
      - '**.py'
      - '**.yml'
      - '**.yaml'
      - 'scripts/security_audit.py'
  schedule:
    - cron: '23 22 * * 1'

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scripts and possible exposed credentials
        run: python scripts/security_audit.py
