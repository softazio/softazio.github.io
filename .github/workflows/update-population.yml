name: Update verified demographic statistics
on:
  schedule:
    - cron: '17 1 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verified-population:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check latest official whitepaper
        run: python scripts/update_population.py
      - name: Commit only verified changes
        run: |
          if ! git diff --quiet -- data/population.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/population.json
            git commit -m "Update verified elderly population statistics"
            git push
          fi
