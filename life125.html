<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIFE 125 試作版 | SOFTAZIO</title><style>:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#142534;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #d9e1e9;padding:20px max(16px,calc((100vw - 1100px)/2))}main{max-width:1100px;margin:auto;padding:24px 16px 80px}h1{margin:0;font-size:clamp(26px,5vw,42px)}h2{font-size:20px;margin:0 0 16px}.muted{color:#546577}nav a{color:#155a8a}section{background:white;border:1px solid #dbe2e9;border-radius:14px;padding:20px;margin:18px 0}label{display:flex;flex-direction:column;font-size:13px;font-weight:650;gap:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #9aabb9;border-radius:7px;background:white;color:#142534;font:inherit;min-height:43px}button,.button{padding:10px 15px;background:#173e65;color:white;border:0;border-radius:8px;cursor:pointer;font:inherit;min-height:44px}button.secondary{background:#e8eff6;color:#173e65}button.danger{background:#8a3030}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.stat{padding:14px;border-radius:10px;background:#f0f5fa}.stat strong{display:block;font-size:24px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:580px}th,td{text-align:left;padding:10px;border-bottom:1px solid #dbe2e9;font-size:13px}svg{max-width:100%;height:auto}.note{background:#fff9e8;padding:12px;border-radius:8px;font-size:13px}#message{min-height:24px;color:#155a8a}details{margin:12px 0}summary{cursor:pointer;font-weight:700} @media(max-width:600px){section{padding:15px}header{padding:16px}}</style></head><body><header><nav><a href="index.html">SOFTAZIO</a> / LIFE 125（開発プレビュー）</nav><h1>LIFE 125</h1><p class="muted">家族の時間と未来のお金を、ひとつの年表に。</p></header><main><p class="note">試作版です。金額はすべて入力による仮定で、税・社会保険料・NISA制度上の上限は自動計算しません。個人情報はこのブラウザ内にのみ保存します。共用端末では保存を避けてください。</p><section><h2>1. 本人と計画期間</h2><div class="fields"><label>本人の呼び名<input id="name" maxlength="60" value="本人"></label><label>生年月日<input id="birth" type="date" value="1990-01-01"></label><label>何歳まで計画する？<input id="endAge" type="number" min="1" max="125" value="95"></label></div><details><summary>家族を登録</summary><div class="fields"><label>呼び名<input id="familyName" maxlength="60" placeholder="例：配偶者"></label><label>続柄<input id="familyRole" maxlength="40" placeholder="例：配偶者"></label><label>生年月日<input id="familyBirth" type="date"></label></div><div class="actions"><button id="addFamily">家族を追加</button></div><div id="familyList"></div></details></section><section><h2>2. 収支と資産（万円）</h2><div class="fields"><label>現在の現預金<input id="cash" type="number" value="300" step="1"></label><label>月の手取り給与<input id="salary" type="number" value="20" step="0.1"></label><label>月の生活費<input id="expense" type="number" value="18" step="0.1"></label><label>退職年齢<input id="retireAge" type="number" value="65" min="0" max="125"></label><label>年金開始年齢<input id="pensionAge" type="number" value="65" min="0" max="125"></label><label>月の年金手取り想定<input id="pension" type="number" value="12" step="0.1"></label><label>NISA等の運用資産残高<input id="invest" type="number" value="0" step="1"></label><label>月の投資積立<input id="contribution" type="number" value="2" step="0.1"></label><label>月の投資取崩し<input id="withdraw" type="number" value="0" step="0.1"></label><label>年間運用利回り（%）<input id="returnRate" type="number" value="3" step="0.1"></label><label>年間物価上昇率（%）<input id="inflation" type="number" value="2" step="0.1"></label><label>年間給与上昇率（%）<input id="wageGrowth" type="number" value="0" step="0.1"></label><label>現在の借入残高<input id="debt" type="number" value="0" step="1"></label><label>借入金利（年%）<input id="debtRate" type="number" value="0" step="0.1"></label><label>毎月の返済額<input id="repayment" type="number" value="0" step="0.1"></label></div></section><section><h2>3. 家族イベントと過去のクロニクル</h2><div class="fields"><label>日付<input id="eventDate" type="date"></label><label>イベント名<input id="eventTitle" maxlength="100" placeholder="例：卒業式"></label><label>種類<select id="eventType"><option value="future">将来の予定・支出</option><option value="past">過去のクロニクル</option></select></label><label>収支額（万円・支出はマイナス）<input id="eventAmount" type="number" step="0.1" value="0"></label><label>繰り返し<select id="eventRepeat"><option value="once">1回のみ</option><option value="annual">毎年</option></select></label></div><div class="actions"><button id="addEvent">イベントを追加</button></div><div class="scroll"><table><thead><tr><th>日付</th><th>出来事</th><th>収支</th><th>区分</th><th>操作</th></tr></thead><tbody id="eventRows"></tbody></table></div></section><section><h2>4. 将来シミュレーション</h2><div class="actions"><button id="calculate">再計算する</button><button class="secondary" id="save">端末内に保存</button><button class="secondary" id="load">保存データを読み込む</button><button class="secondary" id="export">JSONを出力</button><label class="button" style="cursor:pointer">JSONを読み込む<input type="file" id="import" accept="application/json,.json" style="display:none"></label><button class="danger" id="clear">保存データを削除</button></div><p id="message" role="status" aria-live="polite"></p><div class="stats" id="stats"></div><div id="chart" role="img" aria-label="年齢別純資産の推移"></div><p class="muted">グラフの数値は下表でも確認できます。実質価値は開始年を基準に物価上昇率で調整しています。</p><div class="scroll"><table><thead><tr><th>年</th><th>年齢</th><th>現預金</th><th>運用資産</th><th>借入</th><th>純資産</th><th>実質純資産</th></tr></thead><tbody id="yearRows"></tbody></table></div></section></main><script>
'use strict';
const fields=['name','birth','endAge','cash','salary','expense','retireAge','pensionAge','pension','invest','contribution','withdraw','returnRate','inflation','wageGrowth','debt','debtRate','repayment'];
let families=[],events=[];const $=id=>document.getElementById(id);const num=id=>Number($(id).value);const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const msg=s=>$('message').textContent=s;
function ageAt(birth,year,month){const b=new Date(birth+'T00:00:00');return year-b.getFullYear()-(month<b.getMonth()+1?1:0)}
function snapshot(){return {version:1,fields:Object.fromEntries(fields.map(k=>[k,$(k).value])),families,events}}
function validBackupDate(value){
 if(typeof value!=='string'||!/^\d{4}-\d\d-\d\d$/.test(value))return false;
 const d=new Date(value+'T00:00:00');
 return Number.isFinite(d.getTime())&&d.getFullYear()===Number(value.slice(0,4))&&d.getMonth()+1===Number(value.slice(5,7))&&d.getDate()===Number(value.slice(8,10));
}
function restore(s){
 if(!s||typeof s!=='object'||Array.isArray(s)||s.version!==1||!s.fields||typeof s.fields!=='object'||Array.isArray(s.fields)||!Array.isArray(s.families)||!Array.isArray(s.events))throw Error('対応していないデータ形式です');
 if(s.families.length>100||s.events.length>2000)throw Error('登録件数が多すぎます');
 const nextFields={};
 for(const k of fields){
  const value=s.fields[k];
  if(!Object.hasOwn(s.fields,k)||typeof value!=='string'||value.length>100)throw Error('設定項目が不正です');
  if(k==='birth'){if(!validBackupDate(value)||new Date(value+'T00:00:00')>new Date())throw Error('生年月日が不正です')}
  else if(k!=='name'&&(!value.trim()||!Number.isFinite(Number(value))))throw Error('数値項目が不正です');
  nextFields[k]=value;
 }
 const age=ageAt(nextFields.birth,new Date().getFullYear(),new Date().getMonth()+1);
 const endAge=Number(nextFields.endAge);
 if(!Number.isInteger(endAge)||endAge<age||endAge>125||Number(nextFields.inflation)<=-100||Number(nextFields.returnRate)<=-100||Number(nextFields.debtRate)<0)throw Error('試算条件が不正です');
 const nextFamilies=s.families.map(f=>{
  if(!f||typeof f!=='object'||typeof f.name!=='string'||!f.name.trim()||f.name.length>60||typeof f.role!=='string'||f.role.length>40||(!validBackupDate(f.birth)||new Date(f.birth+'T00:00:00')>new Date()))throw Error('家族データが不正です');
  return {name:f.name,role:f.role,birth:f.birth};
 });
 const nextEvents=s.events.map(e=>{
  if(!e||typeof e!=='object'||typeof e.title!=='string'||!e.title.trim()||e.title.length>100||!validBackupDate(e.date)||!['future','past'].includes(e.type)||!['once','annual'].includes(e.repeat)||typeof e.amount!=='number'||!Number.isFinite(e.amount))throw Error('イベントデータが不正です');
  return {date:e.date,title:e.title,type:e.type,amount:e.amount,repeat:e.repeat};
 });
 // 入力形式の検証に加え、計算が成立する場合だけ復元を確定する。
 // 計算が失敗した場合は、元の入力・登録データ・表示を戻す。
 const previous=snapshot();
 try{
  for(const k of fields)$(k).value=nextFields[k];
  families=nextFamilies;events=nextEvents;renderLists();
  if(!calculate())throw Error('復元データの試算条件が不正です');
 }catch(error){
  for(const k of fields)$(k).value=previous.fields[k];
  families=previous.families;events=previous.events;renderLists();calculate();
  throw error;
 }
}
function renderLists(){$('familyList').innerHTML=families.map((f,i)=>`<p>${safe(f.name)}（${safe(f.role)}・${safe(f.birth)}） <button class="secondary" data-family="${i}">削除</button></p>`).join('');$('eventRows').innerHTML=events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<tr><td>${safe(e.date)}</td><td>${safe(e.title)}${e.repeat==='annual'?'（毎年）':''}</td><td>${Number(e.amount).toFixed(1)}</td><td>${e.type==='past'?'過去':'将来'}</td><td><button class="secondary" data-event="${events.indexOf(e)}">削除</button></td></tr>`).join('')}
$('addFamily').onclick=()=>{
 const name=$('familyName').value.trim(),role=$('familyRole').value.trim(),birth=$('familyBirth').value;
 if(!name||name.length>60||role.length>40)return alert('呼び名（60文字以内）と続柄（40文字以内）を確認してください');
 if(!validBackupDate(birth)||new Date(birth+'T00:00:00')>new Date())return alert('生年月日は今日以前の正しい日付を入力してください');
 if(families.length>=100)return alert('家族は100人まで登録できます');
 families.push({name,role,birth});renderLists()
};$('familyList').onclick=e=>{if(e.target.dataset.family!==undefined){families.splice(Number(e.target.dataset.family),1);renderLists()}};
$('addEvent').onclick=()=>{
 const date=$('eventDate').value,title=$('eventTitle').value.trim(),amountRaw=$('eventAmount').value;
 const type=$('eventType').value,repeat=$('eventRepeat').value;
 if(!validBackupDate(date)||!title||title.length>100)return alert('正しい日付とイベント名を入力してください');
 if(!amountRaw.trim()||!Number.isFinite(Number(amountRaw)))return alert('収支額には有限の数値を入力してください');
 if(!['future','past'].includes(type)||!['once','annual'].includes(repeat))return alert('イベントの種類と繰り返しを確認してください');
 if(events.length>=2000)return alert('イベントは2000件まで登録できます');
 events.push({date,title,type,amount:Number(amountRaw),repeat});renderLists();calculate()
};$('eventRows').onclick=e=>{if(e.target.dataset.event!==undefined){events.splice(Number(e.target.dataset.event),1);renderLists();calculate()}};
function invalidate(s){$('stats').innerHTML='';$('yearRows').innerHTML='';$('chart').innerHTML='';msg(s);return false}
function calculate(){const birth=$('birth').value;if(!/^\d{4}-\d\d-\d\d$/.test(birth))return invalidate('生年月日を確認してください');const b=new Date(birth+'T00:00:00');const now=new Date();if(!Number.isFinite(b.getTime())||b.getFullYear()!==Number(birth.slice(0,4))||b.getMonth()+1!==Number(birth.slice(5,7))||b.getDate()!==Number(birth.slice(8,10))||b>now)return invalidate('生年月日は今日以前の正しい日付を入力してください');const startY=now.getFullYear(),startM=now.getMonth()+1;const endAge=num('endAge');if(!Number.isInteger(endAge)||endAge<0||endAge>125||endAge<ageAt(birth,startY,startM))return invalidate('終了年齢は現在の年齢以上、125歳以下にしてください');for(const k of fields.filter(x=>!['name','birth'].includes(x)))if(!$(k).value.trim()||!Number.isFinite(num(k)))return invalidate('数値入力を確認してください');if(num('inflation')<=-100||num('returnRate')<=-100||num('debtRate')<0)return invalidate('物価・運用・金利の設定を確認してください');let cash=num('cash'),inv=num('invest'),debt=Math.max(0,num('debt')),rows=[],shortage=null;const endY=b.getFullYear()+endAge;const endM=b.getMonth()+1;const annualInflation=Math.pow(1+num('inflation')/100,1/12),annualReturn=Math.pow(1+num('returnRate')/100,1/12),annualWage=Math.pow(1+num('wageGrowth')/100,1/12),debtGrowth=Math.pow(1+num('debtRate')/100,1/12);let t=0;if(![cash,inv,debt,annualInflation,annualReturn,annualWage,debtGrowth].every(Number.isFinite)||annualInflation<=0||annualReturn<=0||annualWage<=0||debtGrowth<=0)return invalidate('成長率または資産額が計算可能な範囲を超えています');for(let y=startY;y<=endY;y++){for(let m=y===startY?startM:1;m<=(y===endY?endM:12);m++){let age=ageAt(birth,y,m),wage=age<num('retireAge')?num('salary')*Math.pow(annualWage,t):0,pension=age>=num('pensionAge')?num('pension'):0,spend=num('expense')*Math.pow(annualInflation,t);cash+=wage+pension-spend;for(const e of events){if(e.type==='past')continue;const [ey,em]=e.date.split('-').map(Number);if((e.repeat==='annual'&&em===m&&y>=ey)||(e.repeat!=='annual'&&ey===y&&em===m))cash+=Number(e.amount)||0}const c=Math.max(0,num('contribution'));cash-=c;inv=(inv+c)*annualReturn;const w=Math.max(0,Math.min(inv,num('withdraw')));inv-=w;cash+=w;if(debt>0){debt*=debtGrowth;const payment=Math.min(debt,Math.max(0,num('repayment')));debt-=payment;cash-=payment}if(![cash,inv,debt].every(Number.isFinite))return invalidate('試算中に数値が計算可能な範囲を超えました');if(cash<0&&!shortage)shortage=`${y}年${m}月`;t++}const age=ageAt(birth,y,y===endY?endM:12),net=cash+inv-debt,real=net/Math.pow(annualInflation,t);if(![net,real].every(Number.isFinite))return invalidate('純資産の計算結果が許容範囲を超えました');rows.push({y,age,cash,inv,debt,net,real})}const last=rows.at(-1),fmt=x=>Math.round(x).toLocaleString('ja-JP')+'万円';$('stats').innerHTML=`<div class="stat">最終純資産<strong>${fmt(last.net)}</strong></div><div class="stat">物価調整後<strong>${fmt(last.real)}</strong></div><div class="stat">現預金がマイナスになる時期<strong>${shortage||'期間内になし'}</strong></div>`;$('yearRows').innerHTML=rows.map(r=>`<tr><td>${r.y}</td><td>${r.age}</td><td>${fmt(r.cash)}</td><td>${fmt(r.inv)}</td><td>${fmt(r.debt)}</td><td>${fmt(r.net)}</td><td>${fmt(r.real)}</td></tr>`).join('');const values=rows.map(r=>r.net),min=Math.min(...values,0),max=Math.max(...values,0),span=max-min||1;const points=rows.map((r,i)=>`${45+i*680/Math.max(1,rows.length-1)},${220-(r.net-min)/span*185}`).join(' ');const zero=220-(0-min)/span*185;$('chart').innerHTML=`<svg viewBox="0 0 760 250" aria-hidden="true"><line x1="45" x2="725" y1="${zero}" y2="${zero}" stroke="#9aabb9" stroke-dasharray="4 4"/><polyline fill="none" stroke="#1769a1" stroke-width="3" points="${points}"/><text x="45" y="242" font-size="12">${startY}年</text><text x="650" y="242" font-size="12">${endY}年</text><text x="45" y="20" font-size="12">純資産（万円）</text></svg>`;msg('試算を更新しました（概算）');return true}
$('calculate').onclick=calculate;$('save').onclick=()=>{if(!calculate())return;try{localStorage.setItem('softazio-life125-v1',JSON.stringify(snapshot()));msg('この端末内に保存しました')}catch(e){msg('保存できませんでした。JSON出力をご利用ください')}};$('load').onclick=()=>{try{const s=localStorage.getItem('softazio-life125-v1');if(!s)return msg('保存データはありません');restore(JSON.parse(s));msg('保存データを読み込みました')}catch(e){msg('読み込みに失敗しました')}};$('clear').onclick=()=>{if(!confirm('この端末に保存したLIFE 125のデータを削除しますか？'))return;try{localStorage.removeItem('softazio-life125-v1');msg('保存データを削除しました')}catch(e){msg('保存データを削除できませんでした。ブラウザの保存設定をご確認ください')}};$('export').onclick=()=>{if(!calculate())return;const blob=new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='life125-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>1000000)return msg('1MB以下のJSONファイルを指定してください');try{restore(JSON.parse(await f.text()));msg('JSONを読み込みました')}catch(err){msg('読み込みに失敗しました')}};renderLists();calculate();
</script></body></html>
