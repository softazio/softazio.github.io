<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="計算、記憶、じゃんけん。気軽に遊べる3つのあたまの体操。"><title>毎日3分 あたまの体操 | SOFTAZIO</title><style>
:root{color-scheme:light;--green:#164c3c;--bg:#f7f8f4;--ink:#172c26}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,'Noto Sans JP',sans-serif}header,main,footer{max-width:1000px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d6ded5}a{color:var(--green)}.brand{font-weight:850;letter-spacing:.16em}.tag{font-size:12px;border:1px solid #a8baae;padding:5px 12px;border-radius:30px}h1{font-size:clamp(30px,6vw,54px);line-height:1.4;margin:18px 0}h2{font-size:26px}.lead{color:#4b6257;line-height:1.9}.eyebrow{font-size:12px;letter-spacing:.18em;font-weight:bold;color:#526c60}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:30px 0}.card{text-align:left;background:white;border:1px solid #d6ded5;border-radius:20px;padding:24px;cursor:pointer;min-height:240px;color:inherit}.card:hover{border-color:var(--green);transform:translateY(-3px)}.symbol{font-size:38px;display:block;margin:12px 0}.card strong{display:block;font-size:22px}.card p{line-height:1.8;color:#52665a}.card small{color:#52665a}button,select{font:inherit}button{touch-action:manipulation}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #b76217;outline-offset:4px}.btn{background:var(--green);color:white;border:0;border-radius:12px;padding:16px 25px;font-weight:700;cursor:pointer;min-height:56px}.secondary{background:white;color:var(--green);border:1px solid #a6b7ac}.panel{background:white;border:1px solid #d6ded5;border-radius:24px;padding:clamp(20px,5vw,48px);margin-top:25px;text-align:center}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}.question{font-size:clamp(36px,8vw,64px);font-weight:750;margin:30px 0}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.answer{font-size:26px;padding:20px 10px;background:#f0f5ef;color:#183d2d;border:2px solid #c8d6c6;border-radius:15px;cursor:pointer;min-height:85px}.answer.selected{background:#164c3c;color:white;border-color:#164c3c}.feedback{min-height:35px;margin:20px 0;font-size:19px;font-weight:700}.muted{font-size:14px;color:#52665a;line-height:1.9}.settings{display:flex;gap:15px;align-items:center;flex-wrap:wrap}select{padding:12px;border-radius:8px;border:1px solid #a6b7ac;background:white;color:var(--ink)}footer{font-size:12px;color:#52665a;line-height:1.9;border-top:1px solid #d6ded5;margin-top:35px}progress{width:100%;height:8px;accent-color:var(--green);margin-top:20px}.chips{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.chip{padding:15px;background:#f0f5ef;border-radius:12px;font-size:23px}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0}[hidden]{display:none!important}@media(max-width:650px){.cards{grid-template-columns:1fr}.card{min-height:0;padding:20px}.symbol{float:right}.answers{gap:8px}.answer{font-size:21px;padding:17px 4px}header,main,footer{padding:20px}h1{margin-top:12px}.toolbar{flex-wrap:wrap}}
</style><link rel="stylesheet" href="appearance.css?v=14"><script src="appearance.js?v=6"></script><style>
html[data-sz-theme] body .chip{background:var(--sz-bg)!important;color:var(--sz-text)!important;border:1px solid var(--sz-line)}
html[data-sz-theme] body main button.answer.selected{background:var(--sz-bg)!important;color:var(--sz-text)!important;border:3px solid var(--sz-text)!important;outline:3px solid var(--sz-text);outline-offset:2px}
html[data-sz-theme] body main button.answer.selected:after{content:' ✓';font-size:20px}
button:disabled{cursor:default}button:disabled:not(.selected){opacity:.65}html[data-sz-theme] body .tag{color:var(--sz-text)!important;border-color:var(--sz-line)}
</style><header><span class="brand">SOFTAZIO</span><a class="tag" href="play.html">脳トレゲーム一覧へ</a></header><main><section id="home"><p class="eyebrow">A LITTLE EXERCISE, EVERY DAY.</p><h1>ひと息ついて、<br>あたまを動かそう。</h1><p class="lead">計算する。覚える。ちょっと考える。<br>自分のペースで楽しむ、3つの小さなゲーム。</p><div class="settings"><label for="level">難しさ</label><select id="level"><option value="easy">やさしい</option><option value="normal">ふつう</option><option value="hard">むずかしい</option></select><span class="muted">時間制限なし・音なしで遊べます</span></div><div class="cards"><button class="card" data-game="calc"><small>01 / 計算</small><span class="symbol">＋ −</span><strong>さくっと計算</strong><p>答えを選んで10問。<br>焦らず、一問ずつ。</p><span>はじめる →</span></button><button class="card" data-game="memory"><small>02 / 記憶</small><span class="symbol">▧</span><strong>お買い物の記憶</strong><p>買い物メモを覚えて、<br>棚から商品を選ぼう。</p><span>はじめる →</span></button><button class="card" data-game="rps"><small>03 / 判断</small><span class="symbol">✌</span><strong>あと出しじゃんけん</strong><p>勝つ？ 負ける？ あいこ？<br>お題に合わせて手を選ぼう。</p><span>はじめる →</span></button></div><p class="muted">1種類だけでも、3種類続けても。途中でやめても大丈夫です。</p></section><section id="play" hidden></section></main><footer><div class="footer-links sz-footer-nav"><a href="play.html">ゲーム一覧へ</a><a class="sz-footer-home" href="index.html">トップへ</a><a href="contact.html">CONTACT</a></div><p>毎日3分 あたまの体操 ｜ 気軽に楽しむためのゲームです。認知機能の検査・診断や、予防・治療を目的とするものではありません。</p><p>記録はこのブラウザ内に保存します。ブラウザの設定によっては保存されません。</p></footer><script>
const $=s=>document.querySelector(s),home=$('#home'),play=$('#play');let game,level,n,score,q,locked=false,selected=[],targets=[],stage='';const names={calc:'さくっと計算',memory:'お買い物の記憶',rps:'あと出しじゃんけん'},items=['🍎 りんご','🥛 牛乳','🍞 パン','🥚 たまご','🥕 にんじん','🍌 バナナ','🐟 さかな','🍅 トマト','🧀 チーズ','🥦 ブロッコリー','🍇 ぶどう','🍙 おにぎり'];const rand=n=>Math.floor(Math.random()*n),shuffle=a=>[...a].sort(()=>Math.random()-.5);function read(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>start(b.dataset.game));function start(g){game=g;level=$('#level').value;n=0;score=0;home.hidden=true;play.hidden=false;next();window.scrollTo({top:0,behavior:'smooth'})}function back(){play.hidden=true;home.hidden=false;play.innerHTML=''}function shell(body,total){play.innerHTML=`<div class="toolbar"><button class="btn secondary" id="back">← 種目を選ぶ</button><span>${names[game]} · ${$('#level').selectedOptions[0].text}</span></div><div class="panel"><p class="eyebrow">${n+1} / ${total}</p><progress value="${n}" max="${total}" aria-label="進み具合"></progress>${body}</div>`;$('#back').onclick=back}function next(){locked=false;let total=game==='memory'?3:10;if(n>=total)return finish(total);if(game==='calc'){let max={easy:10,normal:30,hard:99}[level],a=rand(max)+1,b=rand(max)+1,plus=rand(2);if(!plus&&a<b)[a,b]=[b,a];let ans=plus?a+b:a-b;let opts=new Set([ans]);while(opts.size<3)opts.add(Math.max(0,ans+rand(15)-7));q={ans};shell(`<h2>答えを選んでください</h2><div class="question">${a} ${plus?'＋':'−'} ${b} = ?</div><div class="answers">${shuffle([...opts]).map(x=>`<button class="answer" data-answer="${x}">${x}</button>`).join('')}</div><div class="feedback" aria-live="polite"></div>`,total);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer===ans,`答えは ${ans} です。`));}else if(game==='rps'){let hand=rand(3),rule=level==='easy'?0:level==='normal'?rand(2):rand(3),hands=['✊','✌️','🖐️'],text=['勝ってください','負けてください','あいこにしてください'][rule],ans=rule===0?(hand+2)%3:rule===1?(hand+1)%3:hand;q={ans};shell(`<h2>${text}</h2><p class="muted">相手の手</p><div class="question">${hands[hand]}</div><div class="answers">${hands.map((h,i)=>`<button class="answer" data-answer="${i}" aria-label="${['グー','チョキ','パー'][i]}">${h}<br><small>${['グー','チョキ','パー'][i]}</small></button>`).join('')}</div><div class="feedback" aria-live="polite"></div>`,total);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer===ans,`正解は ${['グー','チョキ','パー'][ans]} です。`));}else{targets=shuffle(items).slice(0,{easy:3,normal:4,hard:5}[level]);selected=[];stage='memorize';shell(`<h2>買うものを覚えましょう</h2><p class="muted">覚える時間は自由です。</p><div class="chips">${targets.map(t=>`<span class="chip">${t}</span>`).join('')}</div><div class="actions"><button class="btn" id="remember">覚えた・商品を選ぶ →</button></div>`,total);$('#remember').onclick=showShelf}}
function answer(ok,explain){if(locked)return;locked=true;if(ok)score++;document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(+b.dataset.answer===q.ans)b.classList.add('selected')});$('.feedback').textContent=(ok?'正解！ ':'おしい！ ')+explain;const b=document.createElement('button');b.className='btn';b.textContent=n===9?'結果を見る':'次の問題へ →';b.onclick=()=>{n++;next()};$('.panel').append(b);b.focus()}
function showShelf(){stage='select';shell(`<h2>メモにあった商品を${targets.length}つ選びましょう</h2><p id="count">選択：0 / ${targets.length}</p><div class="answers">${shuffle(items).map(t=>`<button class="answer" style="font-size:19px" data-item="${items.indexOf(t)}" aria-pressed="false">${t}</button>`).join('')}</div><div class="actions"><button class="btn" id="check" disabled>答え合わせ</button></div><div class="feedback" aria-live="polite"></div>`,3);document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{if(locked)return;const t=items[+b.dataset.item];if(selected.includes(t))selected=selected.filter(x=>x!==t);else if(selected.length<targets.length)selected.push(t);b.classList.toggle('selected',selected.includes(t));b.setAttribute('aria-pressed',selected.includes(t));$('#count').textContent=`選択：${selected.length} / ${targets.length}`;$('#check').disabled=selected.length!==targets.length});$('#check').onclick=()=>{if(locked)return;locked=true;let hits=selected.filter(t=>targets.includes(t)).length;if(hits===targets.length)score++;$('.feedback').textContent=`${targets.length}つ中 ${hits}つ正解。買うもの：${targets.join('、')}`;document.querySelectorAll('[data-item]').forEach(b=>b.disabled=true);$('#check').textContent=n===2?'結果を見る':'次のお買い物へ →';$('#check').onclick=()=>{n++;next()}}}
function finish(total){const key=`softazio-brain-${game}-${level}`,previous=read(key);save(key,{score,total,date:new Date().toLocaleDateString('ja-JP')});play.innerHTML=`<div class="panel"><p class="eyebrow">おつかれさまでした</p><h2>${names[game]}</h2><div class="question">${score}<span style="font-size:24px"> / ${total}</span></div><p>${game==='memory'?'すべて覚えられたお買い物の数':'正解した問題数'}</p><p class="muted">${previous?`前回の記録：${previous.score} / ${previous.total}（${previous.date}）`:'最初の記録ができました。'}</p><div class="actions"><button class="btn" id="again">もう一度遊ぶ</button><button class="btn secondary" id="back">ほかの種目へ</button></div><p class="muted">自分のペースで、また気が向いたときに。</p></div>`;$('#again').onclick=()=>start(game);$('#back').onclick=back}
</script></html>
